# SwapVM.sol does not compile without via_ir ("Stack too deep"), so via_ir is
# REQUIRED for anything importing it - which is the router, the instructions and
# every integration test. Upstream sets the same flags; matching them also keeps
# our deployed bytecode comparable to a local build of the pinned source.
[profile.default]
src            = "src"
test           = "test"
script         = "script"
out            = "out"
libs           = ["../node_modules"]
solc_version   = "0.8.30"
optimizer      = true
optimizer_runs = 700
via_ir         = true
fs_permissions = [{ access = "read-write", path = "../deployments" }]

# Fast iteration for contracts that do NOT import SwapVM (e.g. ProofOfFillScore).
# Usage: FOUNDRY_PROFILE=fast forge test --match-contract ProofOfFillScoreTest
[profile.fast]
via_ir         = false
optimizer      = true
optimizer_runs = 700
solc_version   = "0.8.30"

[profile.ci]
via_ir         = true
optimizer      = true
optimizer_runs = 700
solc_version   = "0.8.30"

[fmt]
single_line_statement_blocks = "multi"
multiline_func_header        = "all"
bracket_spacing              = true
int_types                    = "long"
number_underscore            = "thousands"
