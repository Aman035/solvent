name: Attest books

on:
  schedule:
    # backstop only: restarts the chain if it ever breaks. GitHub cron is
    # best-effort and can lag; the chain below is what keeps cadence.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: attest
  cancel-in-progress: false

jobs:
  attest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Sync maker books into SolventBook (8x, ~every 60s)
        # one rate-limited minute must not kill the run; fail only if every pass failed
        run: |
          ok=0
          for i in 1 2 3 4 5 6 7 8; do
            if pnpm attest:books; then ok=$((ok+1)); else echo "::warning::pass $i failed, continuing"; fi
            if [ "$i" != "8" ]; then sleep 60; fi
          done
          echo "$ok/8 passes succeeded"
          [ "$ok" -gt 0 ]
        env:
          # the attestor's own key - ATTESTOR_ROLE only, cannot touch any other wallet
          ATTESTOR_PK: ${{ secrets.ATTESTOR_PK }}
          BASE_SEPOLIA_RPC: https://sepolia.base.org
          SUBGRAPH_URL: https://api.studio.thegraph.com/query/42912/aqua-solvent-base-sepolia/v0.8.0
      - name: Chain the next run
        # only a healthy run chains. A failed run falls back to the 15-minute
        # cron, which is the backoff: a failing run must never spawn another.
        if: success()
        run: gh workflow run attest.yml --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
