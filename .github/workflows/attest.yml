name: Attest books

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: attest
  cancel-in-progress: false

jobs:
  attest:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Sync maker books into SolventBook (4x, ~every 60s)
        # GitHub's cron floor is 5 minutes; looping inside the job gives ~1-minute freshness
        run: |
          for i in 1 2 3 4; do
            pnpm attest:books
            [ "$i" != "4" ] && sleep 60
          done
        env:
          # the attestor's own key - ATTESTOR_ROLE only, cannot touch any other wallet
          ATTESTOR_PK: ${{ secrets.ATTESTOR_PK }}
          BASE_SEPOLIA_RPC: https://sepolia.base.org
          SUBGRAPH_URL: https://api.studio.thegraph.com/query/42912/solvent-sepolia/v0.8.0
