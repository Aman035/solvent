name: Attest books

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: attest
  cancel-in-progress: false

jobs:
  attest:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Sync maker books into SolventBook
        run: pnpm attest:books
        env:
          # the attestor's own key - ATTESTOR_ROLE only, cannot touch any other wallet
          ATTESTOR_PK: ${{ secrets.ATTESTOR_PK }}
          BASE_SEPOLIA_RPC: https://sepolia.base.org
          SUBGRAPH_URL: https://api.studio.thegraph.com/query/42912/solvent-sepolia/v0.8.0
