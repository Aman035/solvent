name: Deploy dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: cd dashboard && pnpm exec vite build
        env:
          DASH_BASE: /solvent/
          # public, keyless endpoints only - nothing secret is baked into the bundle
          SUBGRAPH_URL: https://api.studio.thegraph.com/query/42912/aqua-solvent-base-sepolia/v0.8.0
          SUBGRAPH_URL_BASE: https://api.studio.thegraph.com/query/42912/aqua-solvent-base/v0.2.0
          SUBGRAPH_URL_ARBITRUM: https://api.studio.thegraph.com/query/42912/aqua-solvent-arbitrum/v0.2.0
          SUBGRAPH_URL_OPTIMISM: https://api.studio.thegraph.com/query/42912/aqua-solvent-optimism/v0.2.0
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
