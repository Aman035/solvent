specVersion: 1.0.0
description: Solvent - maker balance sheets and the settlement record
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Aqua
    network: base-sepolia
    source:
      address: "0x525bebb9c5b4dad791402923e344b360bf6ab6a2"
      abi: Aqua
      startBlock: 46430245
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities: [Agent, Strategy, Fill, Counterparty, Global, MakerBook, StrategyToken]
      abis:
        - name: Aqua
          file: ./abis/Aqua.json
        - name: ERC20
          file: ./abis/ERC20.json
      eventHandlers:
        - event: Shipped(address,address,bytes32,bytes)
          handler: handleShipped
        - event: Docked(address,address,bytes32)
          handler: handleDocked
        - event: Pulled(address,address,bytes32,address,uint256)
          handler: handlePulled
        - event: Pushed(address,address,bytes32,address,uint256)
          handler: handlePushed
      file: ./src/aqua.ts

  - kind: ethereum
    name: Router
    network: base-sepolia
    source:
      address: "0x06ac5984d1bdd04aefd3e4e33312f30ce058462e"
      abi: SwapVMRouter
      startBlock: 46430248
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities: [Agent, Strategy, Fill, Counterparty, Global]
      abis:
        - name: SwapVMRouter
          file: ./abis/SwapVMRouter.json
      eventHandlers:
        - event: Swapped(bytes32,address,address,address,address,uint256,uint256)
          handler: handleSwapped
      file: ./src/router.ts

  - kind: ethereum
    name: SolventRouter
    network: base-sepolia
    source:
      address: "0xff00bcc12a34864a3b6e411100bf839ab441c608"
      abi: SwapVMRouter
      startBlock: 46513725
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities: [Agent, Strategy, Fill, Counterparty, Global]
      abis:
        - name: SwapVMRouter
          file: ./abis/SwapVMRouter.json
      eventHandlers:
        - event: Swapped(bytes32,address,address,address,address,uint256,uint256)
          handler: handleSwapped
      file: ./src/router.ts

  - kind: ethereum
    name: Score
    network: base-sepolia
    source:
      address: "0x401b52d106906cc71c31bf96a278c3cefdf18e4d"
      abi: Score
      startBlock: 46560760
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities: [Agent, ScoreSnapshot]
      abis:
        - name: Score
          file: ./abis/Score.json
      eventHandlers:
        - event: ScoreUpdated(indexed address,uint128,uint32,uint32,uint16,uint32)
          handler: handleScoreUpdated
      file: ./src/score.ts

  - kind: ethereum
    name: IdentityRegistry
    network: base-sepolia
    source:
      address: "0xc5734c9bfc4f9d64356dea40e4fa6f8ed23f4a33"
      abi: IdentityRegistry
      startBlock: 46431342
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities: [Agent, AgentIdLink]
      abis:
        - name: IdentityRegistry
          file: ./abis/IdentityRegistry.json
      eventHandlers:
        - event: Registered(indexed uint256,string,indexed address)
          handler: handleRegistered
      file: ./src/erc8004.ts

  - kind: ethereum
    name: ReputationRegistry
    network: base-sepolia
    source:
      address: "0xe5e528e6a54e25df4b0e73d22c0153d6eddbef6d"
      abi: ReputationRegistry
      startBlock: 46431343
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities: [Agent, Review]
      abis:
        - name: ReputationRegistry
          file: ./abis/ReputationRegistry.json
      eventHandlers:
        - event: NewFeedback(indexed uint256,indexed address,uint64,int128,uint8,indexed string,string,string,string,string,bytes32)
          handler: handleNewFeedback
      file: ./src/erc8004.ts

  - kind: ethereum
    name: Recorder
    network: base-sepolia
    source:
      address: "0xffeda75bd96427ab6639a4b25d9a9ac53f51b43b"
      abi: Recorder
      startBlock: 46560762
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities: [Agent, Fill, Global]
      abis:
        - name: Recorder
          file: ./abis/Recorder.json
      eventHandlers:
        - event: FillFailed(indexed bytes32,indexed address,indexed address,address,uint256,bytes4,bytes32,uint8)
          handler: handleFillFailed
      file: ./src/recorder.ts
