# Proof of Fill subgraph.
#
# The join that makes The Graph load-bearing: an Agent's CLAIMED reputation
# (ERC-8004 reviews) sits beside its DELIVERED record (Aqua fills). Neither side
# alone answers "should I trade with this agent" - only the join does.

enum FillStatus { HONORED, FAILED }

type Agent @entity(immutable: false) {
  id: Bytes!                       # wallet address
  "--- delivered: what this agent has actually done ---"
  honoredCount: Int!
  failedCount: Int!
  honoredValueUsd6: BigInt!        # USD, 6dp
  distinctTakers: Int!
  diversityBps: Int!               # 10000 - HHI, recomputed on every fill
  proofOfFillScore: BigInt!        # derived off-chain, mirrors ProofOfFillScore.computeScore
  onChainScore: BigInt!            # last value the attestor actually wrote on-chain
  "--- claimed: ERC-8004 identity + reviews ---"
  agentId: BigInt
  agentURI: String
  registeredAtBlock: BigInt
  reviewCount: Int!
  reviewSum: BigInt!
  reviewAvgBps: Int!
  reviews: [Review!]! @derivedFrom(field: "agent")
  "--- bookkeeping ---"
  firstSeenBlock: BigInt!
  lastActiveBlock: BigInt!
  strategies: [Strategy!]! @derivedFrom(field: "maker")
  fillsMade: [Fill!]! @derivedFrom(field: "maker")
  fillsTaken: [Fill!]! @derivedFrom(field: "taker")
  counterparties: [Counterparty!]! @derivedFrom(field: "maker")
  scoreHistory: [ScoreSnapshot!]! @derivedFrom(field: "agent")
}

type Strategy @entity(immutable: false) {
  id: Bytes!                       # strategyHash
  maker: Agent!
  app: Bytes!                      # the SwapVM router this strategy is shipped to
  program: Bytes!                  # raw SwapVM bytecode - decoded into chips by the UI
  hasReputationGate: Boolean!      # opcode 0x21 present
  hasPriceAdjuster: Boolean!       # opcode 0xb3 present
  tokens: [Bytes!]!
  committed: [BigInt!]!            # amounts promised at ship time (never deposited)
  active: Boolean!
  shippedAtBlock: BigInt!
  shippedTx: Bytes!
  dockedAtBlock: BigInt
  fills: [Fill!]! @derivedFrom(field: "strategy")
}

type Fill @entity(immutable: true) {
  id: Bytes!                       # txHash + logIndex
  strategy: Strategy
  strategyHash: Bytes!
  maker: Agent!
  taker: Agent!
  tokenIn: Bytes!
  tokenOut: Bytes!
  amountIn: BigInt!
  amountOut: BigInt!
  valueUsd6: BigInt!               # USD value the MAKER delivered
  status: FillStatus!
  reason: Bytes                    # revert selector, for FAILED
  failedTxHash: Bytes              # the real reverted tx, for FAILED
  source: Int                      # 0 = attestor-observed, 1 = taker self-reported
  blockNumber: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
}

"Per-counterparty totals, the input to the Herfindahl diversity term."
type Counterparty @entity(immutable: false) {
  id: Bytes!                       # maker ++ taker
  maker: Agent!
  taker: Bytes!
  fillCount: Int!
  valueUsd6: BigInt!
  firstBlock: BigInt!
  lastBlock: BigInt!
}

type ScoreSnapshot @entity(immutable: true) {
  id: Bytes!
  agent: Agent!
  score: BigInt!
  honoredValueUsd6: BigInt!
  honoredCount: Int!
  failedCount: Int!
  diversityBps: Int!
  blockNumber: BigInt!
  txHash: Bytes!
}

"Singleton with indexing-wide totals, for the dashboard's live indicator."
type Global @entity(immutable: false) {
  id: ID!
  totalFills: Int!
  totalHonored: Int!
  totalFailed: Int!
  totalValueUsd6: BigInt!
  lastBlock: BigInt!
}

"""
Maps an ERC-8004 agentId to the wallet that owns it, so review events can be joined
back to the delivery record, which is keyed by address.
"""
type AgentIdLink @entity(immutable: false) {
  id: ID!            # agentId as a decimal string
  agent: Agent!
}

"A CLAIMED reputation record. Free to create: no stake, no prior interaction required."
type Review @entity(immutable: true) {
  id: Bytes!
  agent: Agent!
  reviewer: Bytes!
  value: BigInt!
  valueDecimals: Int!
  tag1: String!
  blockNumber: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
}

"""
A maker's aggregate balance sheet for one token: everything committed across every
strategy, against what the wallet actually holds and has approved. The number Aqua
cannot produce and the SolvencyFloor/SolvencySkew instructions enforce.
"""
type MakerBook @entity(immutable: false) {
  id: Bytes!                 # maker ++ token
  maker: Bytes!
  token: Bytes!
  committed: BigInt!
  backing: BigInt!           # min(balanceOf, allowance to Aqua) at last touch
  utilisationBps: BigInt!    # committed * 10000 / backing, saturating
  updatedAtBlock: BigInt!
}

"Per-strategy per-token committed amount, so docks can be unwound exactly."
type StrategyToken @entity(immutable: false) {
  id: Bytes!                 # strategyHash ++ token
  strategyHash: Bytes!
  maker: Bytes!
  token: Bytes!
  committed: BigInt!
}
